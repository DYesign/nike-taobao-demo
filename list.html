<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    try {
      if (sessionStorage.getItem('nike-demo-access') === 'granted') {
        document.documentElement.classList.add('access-granted');
      }
    } catch (_) {}
  </script>
  <style>.access-granted .password-gate{display:none!important}</style>
  <title>Nike 商品列表</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-fire.png" />
  <link rel="stylesheet" href="list.css?v=18" />
  <link rel="stylesheet" href="list-overrides.css?v=35" />
  <link rel="stylesheet" href="browser-overrides.css?v=42" />
  <link rel="stylesheet" href="install.css?v=33" />
</head>
<body>
  <section class="install-gate" id="installGate" aria-label="安装 Nike Demo"></section>
  <section class="password-gate" id="passwordGate" aria-label="访问验证">
    <form class="password-card" id="passwordForm"><h1>Nike Demo</h1><p>请输入访问密码</p><input id="passwordInput" type="password" autocomplete="current-password" placeholder="访问密码" required /><button type="submit">进入 Demo</button><small id="passwordError" role="alert"></small></form>
  </section>
  <main class="catalog">
    <header class="catalog-head">
      <div class="nav-shot"><img class="nav-full app-only" src="assets/list-nav-full.png" alt="搜索、分类、购物车和商品排序导航" /><img class="nav-compact app-only" src="assets/list-nav-compact.png" alt="商品排序导航" /><img class="nav-full browser-only" src="assets/browser-list-nav-full.png" alt="搜索、分类、购物车和商品排序导航" /><img class="nav-compact browser-only" src="assets/browser-list-nav-compact.png" alt="商品排序导航" /><nav class="nav-hotspots" aria-label="商品排序"><button data-sort="default" aria-label="综合排序"></button><button data-sort="sales" aria-label="销量排序"></button><button data-sort="new" aria-label="上新排序"></button><button data-sort="price" aria-label="价格排序"></button></nav></div>
    </header>
    <div class="deal-line"><span>限时红包</span><b id="countdown">22:31</b></div>
    <section class="product-grid" id="productGrid" aria-label="Nike 商品列表"></section>
  </main>
  <script src="products.js?v=56"></script>
  <script src="list.js?v=56"></script>
</body>
</html>
