<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nike PDP" />
  <script>
    if (window.top === window && !new URLSearchParams(location.search).has('product')) {
      location.replace('./list.html');
    }
  </script>
  <title>Nike Performance FTW</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-fire.png" />
  <link rel="stylesheet" href="styles.css?v=39" />
  <link rel="stylesheet" href="gallery-strip.css?v=39" />
  <link rel="stylesheet" href="browser-overrides.css?v=42" />
  <link rel="stylesheet" href="pdp-overrides.css?v=35" />
  <link rel="stylesheet" href="install.css?v=33" />
</head>
<body>
  <section class="install-gate" id="installGate" aria-label="安装 Nike Demo"></section>
  <section class="password-gate" id="passwordGate" aria-label="访问验证">
    <form class="password-card" id="passwordForm">
      <h1>Nike Demo</h1>
      <p>请输入访问密码</p>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="访问密码" required />
      <button type="submit">进入 Demo</button>
      <small id="passwordError" role="alert"></small>
    </form>
  </section>
  <div class="scroll-header" id="scrollHeader" aria-hidden="true">
    <div class="scroll-header-main">
      <img class="app-only" src="assets/scroll-nav-top-but.png" alt="" />
      <img class="browser-only" src="assets/browser-scroll-nav-top-but.png" alt="" />
      <div class="scroll-search"><img class="scroll-search-icon" src="assets/search-icon.svg" alt="" aria-hidden="true" /><span>Nike 男子公路跑步鞋</span></div>
    </div>
    <nav class="scroll-tabs" aria-label="商品页面导航">
      <button class="active" data-scroll-target="top">宝贝</button>
      <button data-scroll-target="detail">详情</button>
      <button data-scroll-target="recommend">推荐</button>
    </nav>
  </div>
  <main class="phone">
    <section class="hero" aria-label="商品头图轮播">
      <div class="slides" id="slides"></div>
      <img class="nav-top-image app-only" src="assets/nav-top-but.png" alt="" aria-hidden="true" />
      <img class="nav-top-image browser-only" src="assets/browser-nav-top-but.png" alt="" aria-hidden="true" />
      <button class="pdp-back-hotspot" id="pdpBack" aria-label="返回商品列表"></button>
      <div class="counter"><b id="current">1</b>/<span id="total">5</span></div>
    </section>

    <section class="gallery-video-strip" aria-label="图集、视频和商品款式">
      <img src="assets/gallery-video-strip.jpg" alt="图集、视频、黑色款、白色款和全部款式" />
    </section>

    <section class="commerce-info" id="productInfo">
      <div class="price-row"><div class="price" id="productPrice"><small>¥</small>1399</div><span id="productSold">已售 200+</span></div>
      <h1><mark>天猫</mark><span id="productTitle">Nike 男子公路跑步鞋 ZoomX 回弹缓震运动鞋</span></h1>
      <div class="trust-tags"><span>店铺一年回头客 200万+</span><span>官方正品保障</span></div>
    </section>

    <div class="section-gap" aria-hidden="true"></div>
    <button class="vip-row"><span><b>88VIP</b> 百万大额商品 95 折，开 88VIP 一单回本</span><strong>去开通 ›</strong></button>

    <section class="fulfillment">
      <button><img class="info-icon" src="assets/icons/delivery.png" alt="" /><span><strong class="green">最快后日达</strong><small>预计今天发货，后天送达<br />送货上门｜多仓发货｜快递免运费</small></span><i>›</i></button>
      <button><img class="info-icon" src="assets/icons/shield.png" alt="" /><span><strong class="brown">正品保障 · 假一赔四</strong><small>极速退款｜7天无理由退换｜上门取退</small></span><i>›</i></button>
      <button><img class="info-icon" src="assets/icons/spec.png" alt="" /><span class="specs"><em><strong id="specOne">低帮</strong><small>商品类型</small></em><em><strong id="specTwo">公路跑</strong><small>风格</small></em><em><strong id="specThree">Nike</strong><small>品牌</small></em><em><strong id="specFour">男子</strong><small>适用性别</small></em></span><i>›</i></button>
    </section>

    <div class="section-gap" aria-hidden="true"></div>
    <section class="detail-intro" id="productDetail" aria-label="宝贝详情与五星好店信息">
      <img src="assets/detail-intro.png?v=31" alt="宝贝详情，泡棉中底轻盈非凡，天猫五星好店" />
    </section>
    <section class="detail" id="detailSection" aria-label="商品详情长图">
      <img id="detailImage" src="assets/shoe-detail-long.jpeg" alt="Nike Performance FTW 完整商品详情" loading="lazy" decoding="async" />
    </section>
    <footer class="buybar buybar-original">
      <img src="assets/buybar-original.png" alt="店铺、客服、收藏、加入购物车、领券购买" />
      <button class="buybar-hotspot cart" aria-label="加入购物车"></button>
      <button class="buybar-hotspot buy" id="buyNow" aria-label="领券购买"></button>
    </footer>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <script src="products.js?v=43"></script>
  <script src="script.js?v=43"></script>
</body>
</html>
