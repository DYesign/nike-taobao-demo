<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Nike 商品</title>
  <link rel="stylesheet" href="styles.css?v=39" />
  <link rel="stylesheet" href="gallery-strip.css?v=39" />
  <link rel="stylesheet" href="browser-overrides.css?v=64" />
  <link rel="stylesheet" href="pdp-overrides.css?v=36" />
  <style>
    .hero{aspect-ratio:1179/1474}
    .slide video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
    .gallery-video-strip{display:flex;align-items:center;gap:6px;padding:8px 10px}
    .gvs-cell{position:relative;flex:none;width:44px;height:44px;border-radius:7px;overflow:hidden;background:#fff}
    .gvs-cell img{display:block;width:100%;height:100%;object-fit:cover}
    .gvs-cell .gvs-label{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.42);color:#fff;font-size:10px;line-height:15px;text-align:center}
    .gvs-style{display:flex;align-items:center;gap:5px;flex:none;padding:3px 6px 3px 3px;border-radius:7px;background:#fff}
    .gvs-style img{display:block;width:34px;height:34px;border-radius:5px;object-fit:cover}
    .gvs-style span{font-size:10px;color:#666;white-space:nowrap}
    .gvs-all{margin-left:auto;flex:none;color:#777;font-size:12px;white-space:nowrap}
    .gallery-video-strip.static{padding:0;background:transparent}
  </style>
</head>
<body>
  <main class="phone">
    <section class="hero" aria-label="商品头图轮播">
      <div class="slides" id="slides"></div>
      <img class="nav-top-image app-only" src="assets/nav-top-but.png" alt="" aria-hidden="true" />
      <img class="nav-top-image browser-only" src="assets/browser-nav-top-but.png" alt="" aria-hidden="true" />
      <button class="pdp-back-hotspot" id="pdpBack" aria-label="返回"></button>
      <div class="counter"><b id="current">1</b>/<span id="total">1</span></div>
    </section>

    <section class="gallery-video-strip" id="galleryStrip" aria-label="图集、视频和商品款式"></section>

    <section class="commerce-info" id="productInfo">
      <div class="price-row"><div class="price" id="productPrice"><small>¥</small>0</div><span id="productSold"></span></div>
      <h1><mark>天猫</mark><span id="productTitle"></span></h1>
      <div class="trust-tags"><span>店铺一年回头客 200万+</span><span>官方正品保障</span></div>
    </section>

    <div class="section-gap" aria-hidden="true"></div>
    <button class="vip-row"><span><b>88VIP</b> 百万大额商品 95 折，开 88VIP 一单回本</span><strong>去开通 ›</strong></button>

    <section class="fulfillment">
      <button><img class="info-icon" src="assets/icons/delivery.png" alt="" /><span><strong class="green">最快后日达</strong><small>预计今天发货，后天送达<br />送货上门｜多仓发货｜快递免运费</small></span><i>›</i></button>
      <button><img class="info-icon" src="assets/icons/shield.png" alt="" /><span><strong class="brown">正品保障 · 假一赔四</strong><small>极速退款｜7天无理由退换｜上门取退</small></span><i>›</i></button>
      <button><img class="info-icon" src="assets/icons/spec.png" alt="" /><span class="specs"><em><strong id="specOne">低帮</strong><small>商品类型</small></em><em><strong id="specTwo">运动</strong><small>风格</small></em><em><strong id="specThree">Nike</strong><small>品牌</small></em><em><strong id="specFour">男子</strong><small>适用性别</small></em></span><i>›</i></button>
    </section>

    <footer class="buybar buybar-original">
      <img src="assets/buybar-original.png" alt="店铺、客服、收藏、加入购物车、领券购买" />
      <button class="buybar-hotspot cart" aria-label="加入购物车"></button>
      <button class="buybar-hotspot buy" id="buyNow" aria-label="领券购买"></button>
    </footer>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <script src="spotlight.js?v=90"></script>
</body>
</html>
